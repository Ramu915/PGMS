version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pgms_postgres
    restart: always
    environment:
      POSTGRES_USER: pgms_user
      POSTGRES_PASSWORD: pgms_password
      POSTGRES_DB: pgms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgms_user -d pgms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
