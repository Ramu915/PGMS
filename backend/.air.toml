# Air live reload configuration for PGMS Go Monolith Backend
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = ".\\tmp\\main.exe"
  cmd = "go build -o .\\tmp\\main.exe ./cmd/api"
  delay = 1000
  exclude_dir = ["tmp", "uploads", "vendor"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd", "internal", "pkg", "templates"]
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  kill_delay = "500ms"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
